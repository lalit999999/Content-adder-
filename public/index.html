<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>README Git Automator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="max-w-2xl w-full bg-slate-800 border border-slate-700 rounded-xl shadow-2xl overflow-hidden">
    
    <!-- Header -->
    <div class="px-6 py-5 border-b border-slate-700 bg-slate-800/50 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-brands fa-github text-3xl text-indigo-400"></i>
        <h1 class="text-xl font-bold tracking-tight">README Git Automator</h1>
      </div>
      <span class="text-xs font-mono bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full">v1.0</span>
    </div>

    <div class="p-6 space-y-6">
      
      <!-- Form Input -->
      <form id="gitForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Content to Append</label>
          <textarea id="content" rows="5" required
            placeholder="## New Section&#10;Write markdown content here..."
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-sm resize-none"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Commit Message</label>
          <input type="text" id="commitMessage" 
            placeholder="docs: update README.md with new section"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>

        <button type="submit" id="submitBtn" 
          class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-200 flex items-center justify-center space-x-2 shadow-lg">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Update & Push to GitHub</span>
        </button>
      </form>

      <!-- Stage Tracker -->
      <div id="tracker" class="space-y-3 pt-2 hidden">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Execution Pipeline</h2>
        
        <div class="space-y-2">
          <!-- Step 1 -->
          <div id="stage-1" class="flex items-center justify-between p-3 rounded-lg bg-slate-900/60 border border-slate-700/50">
            <span class="text-sm font-medium text-slate-300 flex items-center space-x-2">
              <span class="step-icon text-slate-500"><i class="fa-regular fa-circle"></i></span>
              <span>1. Append Content</span>
            </span>
            <span class="step-status text-xs text-slate-400 font-mono">Pending</span>
          </div>

          <!-- Step 2 -->
          <div id="stage-2" class="flex items-center justify-between p-3 rounded-lg bg-slate-900/60 border border-slate-700/50">
            <span class="text-sm font-medium text-slate-300 flex items-center space-x-2">
              <span class="step-icon text-slate-500"><i class="fa-regular fa-circle"></i></span>
              <span>2. Stage File (Git Add)</span>
            </span>
            <span class="step-status text-xs text-slate-400 font-mono">Pending</span>
          </div>

          <!-- Step 3 -->
          <div id="stage-3" class="flex items-center justify-between p-3 rounded-lg bg-slate-900/60 border border-slate-700/50">
            <span class="text-sm font-medium text-slate-300 flex items-center space-x-2">
              <span class="step-icon text-slate-500"><i class="fa-regular fa-circle"></i></span>
              <span>3. Git Commit</span>
            </span>
            <span class="step-status text-xs text-slate-400 font-mono">Pending</span>
          </div>

          <!-- Step 4 -->
          <div id="stage-4" class="flex items-center justify-between p-3 rounded-lg bg-slate-900/60 border border-slate-700/50">
            <span class="text-sm font-medium text-slate-300 flex items-center space-x-2">
              <span class="step-icon text-slate-500"><i class="fa-regular fa-circle"></i></span>
              <span>4. Push to GitHub</span>
            </span>
            <span class="step-status text-xs text-slate-400 font-mono">Pending</span>
          </div>
        </div>

        <!-- Terminal Error Log -->
        <div id="errorLog" class="hidden p-3 bg-red-950/60 border border-red-800 text-red-300 rounded-lg text-xs font-mono break-words space-y-1">
          <div class="font-bold flex items-center space-x-1">
            <i class="fa-solid fa-triangle-exclamation text-red-400"></i>
            <span>Pipeline Execution Failed</span>
          </div>
          <div id="errorText"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const form = document.getElementById('gitForm');
    const submitBtn = document.getElementById('submitBtn');
    const tracker = document.getElementById('tracker');
    const errorLog = document.getElementById('errorLog');
    const errorText = document.getElementById('errorText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const content = document.getElementById('content').value;
      const commitMessage = document.getElementById('commitMessage').value;

      // Reset UI state
      tracker.classList.remove('hidden');
      errorLog.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;

      resetStages();

      try {
        const response = await fetch('/api/update-readme', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content, commitMessage })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n\n');

          lines.forEach(line => {
            if (line.startsWith('data: ')) {
              const data = JSON.parse(line.replace('data: ', ''));
              updateStageUI(data);
            }
          });
        }
      } catch (err) {
        showError("Network connection error: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Update & Push to GitHub`;
      }
    });

    function resetStages() {
      for (let i = 1; i <= 4; i++) {
        const el = document.getElementById(`stage-${i}`);
        el.className = 'flex items-center justify-between p-3 rounded-lg bg-slate-900/60 border border-slate-700/50';
        el.querySelector('.step-icon').innerHTML = '<i class="fa-regular fa-circle text-slate-500"></i>';
        el.querySelector('.step-status').textContent = 'Pending';
        el.querySelector('.step-status').className = 'step-status text-xs text-slate-400 font-mono';
      }
    }

    function updateStageUI({ stage, status, details }) {
      if (stage === -1 || status === 'error') {
        showError(details);
        return;
      }

      const stageEl = document.getElementById(`stage-${stage}`);
      if (!stageEl) return;

      const icon = stageEl.querySelector('.step-icon');
      const statusText = stageEl.querySelector('.step-status');

      if (status === 'active') {
        stageEl.className = 'flex items-center justify-between p-3 rounded-lg bg-indigo-950/40 border border-indigo-500/50';
        icon.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-indigo-400"></i>';
        statusText.textContent = 'In Progress';
        statusText.className = 'step-status text-xs text-indigo-400 font-mono font-semibold';
      } else if (status === 'success') {
        stageEl.className = 'flex items-center justify-between p-3 rounded-lg bg-emerald-950/30 border border-emerald-500/40';
        icon.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
        statusText.textContent = 'Completed';
        statusText.className = 'step-status text-xs text-emerald-400 font-mono font-semibold';
      }
    }

    function showError(msg) {
      errorLog.classList.remove('hidden');
      errorText.textContent = msg;
    }
  </script>
</body>
</html>
